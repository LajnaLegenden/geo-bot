<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GeoBot{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('dashboard') if session.get('uid') else url_for('auth.login') }}">🌍 GEO<span>BOT</span></a>
    <nav class="topnav">
      {% if session.get('uid') %}
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <button class="btn-ghost" type="submit">Log out</button>
      </form>
      {% endif %}
    </nav>
  </div>
</header>
<main class="container">
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}<div class="flash">{% for m in msgs %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
