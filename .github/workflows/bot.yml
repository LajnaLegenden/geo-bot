name: geoguessr-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "new or update"
        required: true
        default: "update"
      map:
        description: "map name for `new` (see geobot/maps.py)"
        required: false
        default: "normal"

permissions:
  contents: write   # needed to commit the updated store.json back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "map=${{ github.event.inputs.map }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 7 * * 1-5" ]; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
            echo "map=normal" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "24 11 * * 1-5" ]; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
            echo "map=fast" >> "$GITHUB_OUTPUT"
          else
            echo "mode=update" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          GEO_NCFA: ${{ secrets.GEO_NCFA }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WORKFLOW_URL: ${{ secrets.SLACK_WORKFLOW_URL }}
          SLACK_SINK: workflow
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "new" ]; then
            python -m geobot.main new "${{ steps.mode.outputs.map }}"
          else
            python -m geobot.main update
          fi

      - name: Commit updated store
        run: |
          git config user.name  "geo-bot"
          git config user.email "geo-bot@users.noreply.github.com"
          git add data/store.json
          git commit -m "update store [skip ci]" || echo "nothing to commit"
          git push
