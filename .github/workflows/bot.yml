name: geoguessr-bot

on:
  schedule:
    # Times are UTC (GitHub cron has no DST). Set for Swedish summer (CEST, UTC+2).
    # ponytail: winter (CET, UTC+1) shifts these an hour early; add 1h to each UTC hour to re-align.
    - cron: "0 8 * * *"    # 08:00 UTC = 10:00 CEST — create today's challenge
    - cron: "0 14 * * *"   # 14:00 UTC = 16:00 CEST — refresh scores + post leaderboard
  workflow_dispatch:
    inputs:
      mode:
        description: "new or update"
        required: true
        default: "update"

permissions:
  contents: write   # needed to commit the updated store.json back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
          else
            echo "mode=update" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          GEO_NCFA: ${{ secrets.GEO_NCFA }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WORKFLOW_URL: ${{ secrets.SLACK_WORKFLOW_URL }}
          SLACK_SINK: workflow
          GEO_MAP: "6029991c5048850001d572a9"   # geoguessr.com/maps/<id>
          GEO_TIME_LIMIT: "120"
          GEO_NO_MOVE: "1"
        run: python -m geobot.main ${{ steps.mode.outputs.mode }}

      - name: Commit updated store
        run: |
          git config user.name  "geo-bot"
          git config user.email "geo-bot@users.noreply.github.com"
          git add data/store.json
          git commit -m "update store [skip ci]" || echo "nothing to commit"
          git push
